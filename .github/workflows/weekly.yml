name: weekly-fundamentals
on:
  schedule:
    - cron: '0 8 * * 6'   # 每周六 08:00 UTC，基本面/成分股类低频数据
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas requests lxml
      - run: python scripts/test_build_fundamentals.py   # offline test first; a failure stops this run
      - run: python scripts/build_fundamentals.py
      - run: python scripts/fetch_logos.py   # 自托管 logo 同步（新增成分股补图，已有跳过）
      - name: commit data
        run: |
          git config user.name "klaywang24"
          git config user.email "klaywang24@users.noreply.github.com"
          git add data logos
          git commit -m "data: weekly fundamentals $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
      # 2026-09-25: after the commit, so a history-source outage never blocks the week's data; fails the job when
      # more than 5 tickers outside the frozen list had to carry last week's PE history (09-24 wiped all 35 and the
      # job still passed). 2026-09-26: history now comes from SEC EDGAR + Yahoo (edgar_history.py), not macrotrends.
      - run: python scripts/build_fundamentals.py --check-carried 5
