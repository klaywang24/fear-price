name: daily-update
on:
  schedule:
    - cron: '0 22 * * 1-5'   # 工作日 UTC 22:00 ≈ 美东收盘后 1~2 小时
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ fetch-depth: 0 不可删——checkout 默认浅克隆(depth=1)，
      # 那样 verify_ledger 只能看见 1 个 commit，对不出任何历史改写，
      # 却会若无其事地报「总分歧=2」。2026-07-18 首次接线当场踩到：
      # 检查器不是不跑，是瞎着跑还给出一个看起来很干净的数字。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yfinance pandas requests lxml openpyxl
      - run: python scripts/build_data.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      # 台账自核：把 data/README「修订政策」从一句断言变成每日机器核验。
      # 必须在 commit 之前跑——此刻 git 历史里还是「昨天之前发布过的值」，
      # 拿它跟刚重算出来的文件对，才能看出本次重算有没有改写已发布的历史。
      # 产物 data/ledger_audit.json 随下一步 git add data 一起提交、公开可查。
      - name: verify ledger
        id: verify
        run: python scripts/verify_ledger.py
      # 口径自检：verify_ledger 管「发布过的值没被改写」，这一步管「今天的值仍由
      # 同一把尺算出」——当日头条百分位用参考实现独立重算一遍对账（取数漂移/
      # 窗口污染/代码漂移三种翻车都会在此现形）。必须在 commit 之前跑——
      # 产物 data/gauge_math.json 随 git add data 一起提交、公开可查。
      - name: verify gauge math
        id: gaugemath
        run: python scripts/verify_gauge_math.py
      # 哈希链：让「这份数据确实是那天记的」十年后仍能被外人验证。
      # 必须在 commit 之前跑——此刻 data/ 已是当日终稿，哈希算的就是随后被提交的那份字节。
      # 🔑 链（而非独立每日哈希）的全部理由：独立哈希挡不住「事后偷偷删掉难看的那几天」，
      #    剩下的照样验证通过；链把每天绑在前一天上，删任何一天其后 chain 全部对不上。
      - name: anchor hashes
        run: python scripts/anchor_hashes.py
      # 图表溢出自检（2026-08-02 接线）。
      # 起因：全站图表画到绘图区外面（恐惧的标价台账那张末点溢出 219px，多个面板同病），
      # 根因是 ECharts 记的容器宽度是旧的（getWidth()=1086 而 clientWidth=867）。
      # 已改用 ResizeObserver 由尺寸变化驱动 resize；这一步是那条修复的守门人。
      # 🔑 之所以必须挂在 CI 而不是「记得手动跑」：同一天里已经吃过两次亏 ——
      #    闸⑥ 建好却没写进 gate_all 的 run 行，于是十几次「六闸全绿」实际只跑了五闸。
      #    **规矩没变成自动跑的动作，就等于没有。**
      # 脚本自带临时 http server，只需要一个 Chrome。ubuntu-latest 预装 Google Chrome。
      - name: verify chart overflow
        run: python tools/check_chart_overflow.py
        env:
          CHROME_BIN: /usr/bin/google-chrome
      # i18n 重复 key 自检（2026-08-06 接线）。
      # 起因：词典 D 里 22 处重复 key（JS 后者静默覆盖前者），行业暴露图的 GICS 全名版
      # 被旧短名版压了 18 天没人发现。已去重归零，这一步防复发。
      # exit 2 = 测量失败（解析漂移），与红同样挡住流水线，绝不算绿。
      - name: verify i18n no duplicate keys
        run: python tools/check_i18n_dupes.py
      # EN 态中文残留闸（2026-09-05 接线）。闸本体 2026-08-07 就建好了，但从未挂进流水线：
      # 全仓 grep 零处 run，于是它在仓里躺了 29 天，一次也没拦过东西。
      # 出身：09-05 发现英文站 12 处中文残留。根因是「标点四禁」把 HTML 里的引号与直角引号
      # 清掉了，却没同步改 js/i18n.js 的查表 key —— applyTo 按整节点逐字精确匹配，key 差
      # 一个字符就整句 fallback 成中文。check_site_punctuation 的提示里本就写着这条警告。
      # 本闸自带负向自验：zh 态若扫不出 100 条以上即 exit 2 报量尺失效，防止假绿。
      # 接线当天实测：en 态 exit 0（仅剩 5 条有意保留），zh 态扫出 824 条 —— 尺子是活的。
      - name: verify no Chinese leaking into EN
        run: python tools/check_i18n_leak.py
        env:
          CHROME_BIN: /usr/bin/google-chrome
      # 禁词闸（2026-08-07 接线）。「恐慌指数」只允许作为 VIX 的归属性提及
      # （前 4 字内须有 VIX），不用来指称本站任何指数。机器可判不靠自觉。
      # 建闸当天已用负向样本实测报红（植入一处→exit 1→还原→复绿），不是只写不验。
      - name: verify banned terms
        run: python tools/check_banned_terms.py
      # 路由页判重闸（2026-08-17 接线）。
      # 07-30 路由页只换 head、正文 17 份相同 → 08-08 GSC 判重复拒收；本闸保证
      # 每个路由页只含自己的 panel、canonical 自指、sitemap 与实际页面清单精确对账。
      # 建闸当天先对修复前产物实测：166 条红 exit 1，修复后转绿 —— 负向已验，不是只写不验。
      - name: verify route pages unique
        run: python tools/check_route_pages.py
      # JSON-LD 结构化数据闸（2026-08-23 接线）。
      # 出身：08-20 c25a51e「去掉可见文本里的直引号」是全文替换，把 JSON-LD 的**结构引号**
      # 也吃掉了（"name":"X" → "name":X）；index.html 一处坏 ⇒ 16 个路由页由它生成 ⇒
      # 全站 19 页结构化数据全部非法，**三天无人发现**，直到 Google Search Console 发邮件
      # 「值类型不正确·严重问题会导致您的网页无法显示在搜索结果中」。
      # 那三天里 §63 做的判重/canonical/Dataset 标注，Google 一个字都没读进去。
      # 判据：每个 ld+json 块必须 json.loads 通过；扫到 0 个块也判红（尺子没上膛≠仓里没有）。
      # 自检：python tools/check_jsonld.py --selftest（一正两负三样本）
      - name: verify JSON-LD parses
        run: python tools/check_jsonld.py
      # 🔴 2026-09-05 建（Klay 令做 llms.txt + openapi 那套）：机器可读层是**生成物**，
      # 而 llms.txt 与 data/README.md 是手改的 —— 手改了不重出，llms-full.txt 与 openapi.json
      # 就会静静地过期，且**过期的机器可读层比没有更坏**（模型会照着旧契约引用）。
      # 判据＝生成器 --check：产物与「照当前源应生成的内容」不一致即红，逼人重出。
      # 🚫 刻意不在 CI 里自动重写：那会让 CI 悄悄改站上的对外契约，改契约必须过人眼。
      - name: verify machine-readable layer fresh
        run: python scripts/build_machine_readable.py --check
      - name: commit data
        run: |
          git config user.name "klaywang24"
          git config user.email "klaywang24@users.noreply.github.com"
          git add data
          git commit -m "data: daily update $(TZ=America/New_York date +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
      # 锚定：把「公开可查」做成机制——git 日期本地可伪造，第三方存档不能。
      # 存当日 commit 的 GitHub 页（见证提交历史状态）+ 站点 + 两个台账 JSON。
      # Wayback 不稳定属常态：任何失败都不许影响管线与告警（continue-on-error + 逐条 || true）。
      # 🔴 2026-08-04 重写（原内联 bash 有三个叠加 bug，见 scripts/anchor_wayback.py 头注）：
      #    A. curl -sS 不带 -f，HTTP 429/503 退出码仍是 0 → 被限流计成成功
      #    B. 本步排在 commit data 之后，写完 anchor_log.jsonl runner 就销毁
      #       →「随下次 commit 提交」永远不会发生，该文件从未存在过一次
      #    C. 只记 ok/fail 计数，证明不了「它存下来了」
      #    实测后果：链头 ledger_hashes.jsonl 的快照 8 次全在 7 月、08-01 起断供三天，
      #    而 CI 每天照报「成功 5/5」。
      # ⚠️ 本步仍须排在 commit 之后（要锚 commit 页 + 等 CF Pages 部署），
      #    所以它**自己提交自己的日志**，不再指望别人的 commit 带上它。
      - name: anchor to Wayback
        continue-on-error: true
        # 🔴 2026-09-23 加凭据（Klay 令）：匿名 Save Page Now 已失效——
        #    实测对每个 URL 都返回 500，我们发出去的存档提交**一个都没成功过**，
        #    而快照仍在更新（IA 自家爬虫顺手抓的）掩盖了这件事整整很久。
        #    两个 Secret 在仓库 Settings → Secrets and variables → Actions 里配；
        #    没配时脚本自动退回匿名 GET，行为与从前一致，不会把 CI 弄挂。
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: |
          python scripts/anchor_wayback.py --sha "$(git rev-parse HEAD)"
          # 🔴 2026-09-03 加 anchor_pending.json（Klay 令·补探队列）：
          #    本步是**自提交**，runner 随后销毁 ⇒ **没被 git add 的文件等于没写过**。
          #    补探队列必须跨轮存活（CI 每次都是全新机器，内存里的名单活不过一轮），
          #    所以它和 anchor_log 一样必须逐个点名 add。**加新产物必须回来改这一行。**
          if [ -n "$(git status --porcelain data/anchor_log.jsonl data/anchor_pending.json)" ]; then
            git add data/anchor_log.jsonl data/anchor_pending.json
            git commit -m "anchor: wayback log $(TZ=America/New_York date +%F)"
            git pull --rebase -q origin main || true
            git push
          fi

      # 体检结果进 GITHUB_ENV → notify_discord 当天推 Discord。
      # ⚠️ 这是「当天可见」那条通道；**它不能替代 witness-watchdog.yml** ——
      #    本步在 daily 内部，daily 死了它也一起没了（7·12 的教训）。两条都要。
      # --record：把各项状态追加进 data/health_log.jsonl 并自提交。
      # 🔑 为什么需要这份日志（2026-08-06 加）：「持续测不到」要能升级成故障，
      #    就必须知道「上次成功是哪天」—— 那是跨运行的状态，只能落盘。
      #    自提交范式照抄上面 anchor to Wayback 那步（家规 §26 先用现成做法）；
      #    看门狗只读它不写（它的权限就是 contents: read）。
      - name: witness health
        continue-on-error: true
        run: |
          set +e
          python scripts/check_witness_health.py --record
          echo "WITNESS_HEALTH=$([ $? -eq 0 ] && echo ok || echo bad)" >> "$GITHUB_ENV"
          set -e
          if [ -n "$(git status --porcelain data/health_log.jsonl)" ]; then
            git add data/health_log.jsonl
            git commit -m "health: log $(TZ=America/New_York date +%F)"
            git pull --rebase -q origin main || true
            git push
          fi

      - name: notify Discord
        if: always()
        run: python scripts/notify_discord.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # 空值（verify 步骤没跑成）→ 脚本不会谎报「台账无异常」，只是不发这条告警；
          # 真出事时 JOB_STATUS 那道闸会先响。
          LEDGER_DELTA: ${{ steps.verify.outputs.delta }}
          LEDGER_RELIABLE: ${{ steps.verify.outputs.reliable }}
          # 空值（gaugemath 步骤没跑成）→ 不发这条告警也不谎报正常，JOB_STATUS 闸先响
          GAUGE_MATH_OK: ${{ steps.gaugemath.outputs.ok }}
