name: witness-watchdog
# 见证链看门狗（2026-08-04 新建）。
#
# 🔑 为什么它必须是**独立 workflow、独立时刻**，而不是 daily.yml 里的一步：
#    daily 里的告警有个致命前提 —— daily 自己还活着。2026-07-12→14 那次正是
#    daily 整个死掉 4 天没人发现，于是「失败告警」也跟着一起没了。
#    本 workflow 专门从**产物**倒推（data/kindex.json 多久没更新了），
#    所以 daily 死掉时它照样会响。看守看守人的那一层。
#
# 🔑 为什么报警走 GitHub Issue 而不是 print：
#    2026-08-04 修完锚定 bug 后我加了 `::warning::`，随即意识到自己重建了
#    7·12 的同一个失败模式 —— **告警只进 Actions 日志，而没人每天读日志**。
#    Issue 会自动发邮件、会留在列表里直到被处理，**不会被下一次运行冲掉**。
#    没有送达通道的告警等于没有告警。
on:
  schedule:
    - cron: '0 13 * * *'   # 每天 UTC 13:00 ≈ 美东 09:00，与 daily(22:00 UTC) 错开半天
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write            # 只要开 issue 的权限，不给写仓库
  actions: read            # 🆕 2026-08-06：check_daily_dispatched 要读 daily.yml 的 run 历史
                           #    （判「压根没触发」只能从 Actions API 看，产物新鲜度看不出来）
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 —— check_daily_alive 要读 data/kindex.json 的提交历史，
      # 浅克隆会让它只看见一个 commit 然后给出一个「看起来很正常」的数字
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🔴 2026-08-04 修（首次实跑就栽了）：
      #    初版在 `set -e` 恢复之后又跑了一遍脚本，而**「不健康」的退出码就是 1** ——
      #    于是「检测到问题」被当成「脚本崩了」，整步失败、开 Issue 那步被跳过，
      #    Klay 收到的是 GitHub 通用的「Run failed」邮件，不是我设计的那封体检报告。
      #    🔑 教训：退出码 1 在这里是**正常输出**不是错误。凡是「非零=有发现」的脚本，
      #       都不能直接放进默认 fail-fast 的 CI 步骤里。
      #    ∴ ①只跑一次，两种格式各存一份 ②`|| true` 吞掉预期的非零
      #      ③判据从 JSON 里读 overall，不靠 $?（它已被 || true 吃掉）
      - name: witness health check
        id: health
        # 2026-09-25：check_daily_dispatched 调 Actions API；原先没传 token ⇒ 匿名请求（共享 IP 易撞限流误报），actions: read 白申请
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_witness_health.py --json > /tmp/health.json 2>/dev/null || true
          python scripts/check_witness_health.py      > /tmp/health.txt  2>&1 || true
          cat /tmp/health.txt
          # 脚本真崩了（JSON 都没写出来）才让本步失败 —— 那才是真错误
          OVERALL=$(python -c "import json;print(json.load(open('/tmp/health.json'))['overall'])")
          echo "overall=$OVERALL" >> "$GITHUB_OUTPUT"
          { echo 'report<<HEALTH_EOF'; cat /tmp/health.txt; echo 'HEALTH_EOF'; } >> "$GITHUB_OUTPUT"

      # 不健康 → 开 issue（同一天重复运行只更新，不刷屏）
      - name: open or update issue
        # always()：本步失败时也要能开 Issue —— 少了它，这次就是被静默跳过的
        if: always() && steps.health.outputs.overall == 'bad'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🔴 见证链体检未通过';
            const body = [
              '证据链自动体检发现异常。**这不是站点故障，是「证明站点没被改过」那套机制出了问题** ——',
              '它坏了不会影响读者看到的任何东西，所以只能靠这条告警发现。',
              '',
              '```',
              `${{ steps.health.outputs.report }}`,
              '```',
              '',
              `运行：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '本地复现：`python3 scripts/check_witness_health.py`',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'witness-chain',
            });
            if (open.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['witness-chain'],
              });
            }

      # 恢复了就自动关掉，免得旧 issue 一直挂着让人麻木。
      # 🔴 2026-08-05 修：关闭判据从 ==ok 改成 !=bad。首次实跑抓到的真空档：
      #    IA 限流时「链头快照」项是 unknown → 总体 unknown → 开(==bad)关(==ok)两头都不沾，
      #    告警永远挂着 —— 恰恰造成本注释第一行要防的「挂着让人麻木」。
      #    量不到 ≠ 出事；真出事时 daily-alive（本地 git 判断，几乎不会 unknown）会变 bad 兜底。
      #    outputs 为空（脚本真崩）时两步都不跑、run 本身红 → GitHub 自己会发失败邮件。
      - name: close issue when healthy
        if: always() && steps.health.outputs.overall != 'bad' && steps.health.outputs.overall != ''
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'witness-chain',
            });
            for (const i of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: '✅ 已无 🔴 异常项，自动关闭。⚠️ 本判据是「没有 bad」，**不等于每项都成功测到**；❔ 未测到的项若连续超期未成功，会被升级为 bad 再次开单（2026-08-06 起）。\n\n```\n' + `${{ steps.health.outputs.report }}` + '\n```',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }
