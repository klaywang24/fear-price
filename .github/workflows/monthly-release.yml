name: monthly-release
# 月度台账快照：给哈希链加一层「第三方登记的版本记录」。
# 为什么需要它（daily.yml 已有链 + Wayback）：链是流水、Wayback 是散点快照，
# 两者都不方便被别人写进参考文献。Release 给出一个可引用的版本号，且发布时间
# 由 GitHub 服务端记录 —— 本地 `git commit --date=` 伪造不了它。
# 接上 Zenodo 后每个 Release 自动拿一个 DOI（一次性手工授权，见 .zenodo.json 注释）。
on:
  schedule:
    - cron: '0 6 2 * *'   # 每月 2 号 UTC 06:00：留一天缓冲，确保上月最后一个交易日的 daily 已入链
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM（留空=上一个自然月）'
        required: false
permissions:
  contents: write
# 同月两个实例并行 = 竞态写入已发布证据的温床；排队而非取消（取消会留半成品状态）
concurrency:
  group: monthly-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 与 daily.yml 同理——浅克隆会让任何基于历史的检查瞎着跑还给出干净数字
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🔴 先验链再打包。链断了还发版 = 把一份坏证据盖上official 图章，
      #    比不发版严重得多。anchor_hashes.py --verify 自身失败会让本步非零退出。
      - name: verify chain before packaging
        run: python scripts/anchor_hashes.py --verify

      # 走 env + shell 判空，不用 `${{ inputs.x && format(...) }}`：
      # schedule 触发时 inputs 不存在，那种写法可能渲染成字面量 false 传给脚本。
      - name: build bundle
        id: bundle
        env:
          MONTH: ${{ github.event.inputs.month }}
        run: |
          if [ -n "$MONTH" ]; then
            python scripts/make_release_bundle.py --month "$MONTH"
          else
            python scripts/make_release_bundle.py
          fi
          M=$(ls dist/kapx-ledger-*.zip | head -1 | sed 's|.*kapx-ledger-\(.*\)\.zip|\1|')
          echo "month=$M" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat dist/CUT_SHA-$M.txt)" >> "$GITHUB_OUTPUT"

      # 🔴 发版必过闸（2026-08-04 Klay 定）：用一个**刻意不 import 项目代码**的实现
      #    照 VERIFY.md 印出来的公式复算一遍。两边用同一份实现发现不了任何东西。
      #    由来：08-03 首个包的 VERIFY.md 链公式写错，照它验会得出「链断了」——
      #    发布一份错的验证方法，比不发验证方法更糟。
      # 闸的自测先于闸的使用：现场造 6 类坏样本喂给验证器，任何一个被放行就中止发版。
      # 为什么进 CI 而不是留在 commit message：人工负向测试没人会重跑（§50②），
      # 而 2026-08-07 实测证明验证器可以瞎四天没人知道。
      - name: gate self-test (negative samples)
        run: >
          python scripts/test_release_gate.py
          "dist/kapx-ledger-${{ steps.bundle.outputs.month }}.zip"
          "${{ steps.bundle.outputs.month }}"
          "${{ steps.bundle.outputs.sha }}"

      - name: independent re-verification
        run: python scripts/verify_release.py "dist/kapx-ledger-${{ steps.bundle.outputs.month }}.zip" --expect-month "${{ steps.bundle.outputs.month }}" --expect-cut "${{ steps.bundle.outputs.sha }}"

      # 🔴🔴 2026-08-06 热修：**删掉 `--clobber`，改为 fail-closed**
      #
      # ━━ 原来那行是什么 ━━
      #     gh release upload "$TAG" ... --clobber
      #     gh release edit  "$TAG" --notes-file ...
      # 「同月重跑不炸」的代价是：**同一个已公开的证据地址，字节可以被悄悄换掉**，
      # 而 Zenodo/DOI 不会因此形成新版本 ⇒ 引用同一个 DOI 的人，前后拿到的可能是
      # 不同内容。这直接违反本项目的立身之本：**只追加、绝不重写**。
      # 没有人真的这么干过，但**手动重跑同月 workflow 就会触发**，属于「哪天会烧」。
      #
      # ━━ 为什么判据不是「新旧 ZIP 字节相同就放行」━━
      # 因为**本包不是可复现构建**（实测）：`make_release_bundle.py` 的
      # `packaged_on = today.isoformat()` 进了 MANIFEST/VERIFY.md，且 `z.writestr()`
      # 不带显式 ZipInfo ⇒ 每个条目的时间戳取当前时刻。**同样的数据两次打包字节必然不同**。
      # 拿 checksum 比会天天误报 ⇒ 「会误报的闸比没闸更糟」。
      # ∴ 判据改为验**有效性**而不是**字节同一性**：
      #     ① 远端 tag 必须仍指向本次算出的月末 commit（CUT_SHA）——防 tag 被挪
      #     ② 把**线上那份已发布的附件**下下来，用不 import 项目代码的独立实现验一遍
      #   两条都过 ⇒ 已发布的证据是有效的 ⇒ **什么都不碰（no-op）**
      #   任何一条不过 ⇒ **硬失败**，绝不覆盖，留给人处理
      #
      # ━━ 需要修订怎么办 ━━
      # **永远新增，不改旧的**：另起 tag `ledger-YYYY-MM-r2`（Zenodo 会形成新 version），
      # 旧版原样留着 + 公开勘误。与链的「错行不改、配勘误」同一条原则。
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          M="${{ steps.bundle.outputs.month }}"
          TAG="ledger-$M"
          CUT_SHA="${{ steps.bundle.outputs.sha }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG 已存在 —— 进入只读校验路径，绝不覆盖已发布证据"

            # ① 远端 tag 必须仍指向本次算出的月末 commit。
            # 🔴 2026-08-07 修：只信 git ls-remote 的远端真值，**绝不回退到本地 tag** ——
            #    负向实测：远端 tag 被挪、本地还是旧值时，旧写法（rev-parse 本地 tag）会放行。
            #    ^{} 取注解 tag 剥壳后的 commit；轻量 tag 无 ^{} 行，取原行即 commit。
            RESOLVED="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
            [ -z "$RESOLVED" ] && RESOLVED="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
            if [ -z "$RESOLVED" ]; then
              echo "::error::查询远端 tag $TAG 失败（网络？）—— 状态不明时拒绝任何写入"
              exit 1
            fi
            if [ "$RESOLVED" != "$CUT_SHA" ]; then
              echo "::error::远端 tag $TAG 指向 $RESOLVED，但本次算出的月末 commit 是 $CUT_SHA"
              echo "已发布的证据与当前计算不一致 —— 拒绝任何写操作。修订请另起 $TAG-r2。"
              exit 1
            fi

            # ② 下载线上那份已发布的附件，用独立实现验它（不是验我们刚打的那份）
            rm -rf dist/_published && mkdir -p dist/_published
            # 目录上一行已 rm -rf，不需要 --clobber；**刻意不留这个词**，
            # 免得将来 grep 的人以为覆盖逻辑还在。
            # 🔴 2026-08-07 修：按**精确文件名**下载 —— '*.zip'+head -1 会被
            #    「Release 上多传一个 zip」劫持成验错对象。
            gh release download "$TAG" -D dist/_published -p "kapx-ledger-$M.zip"
            PUB="dist/_published/kapx-ledger-$M.zip"
            if [ ! -f "$PUB" ]; then
              echo "::error::$TAG 没有名为 kapx-ledger-$M.zip 的附件 —— 拒绝写入，请人工处理"
              exit 1
            fi
            # --expect-*：把「这个包」钉死在「这个月、这个 commit」上（负向实测：
            # 不钉的话错月份包、错 cut_at_commit 的包都能过）
            python scripts/verify_release.py "$PUB" --expect-month "$M" --expect-cut "$CUT_SHA"

            echo "::notice::已发布附件通过独立复算、tag 指向正确 ⇒ 本次 no-op，不上传不改 notes"
            exit 0
          else
            # 🔴 两步，顺序不能换。先用 git 推 tag，再从「已存在的 tag」建 release。
            #    ① tag 必须指向月末 commit：Zenodo 不看 Release 附件，它抓 tag 所指
            #       commit 的整仓 zipball。tag 打在 HEAD 上，DOI 存的就是发版当天的
            #       仓库状态，与标签月份对不上 —— 而 DOI 永久改不了（2026-08-03 实测
            #       首个 7 月版就是这么错的：链 13 行、覆盖到 08-03）。
            #    ② 不能用 `gh release create --target <sha>` 一步到位：那会让 REST API
            #       同时建 tag + 建 release，GITHUB_TOKEN 对此回 403
            #       "Resource not accessible by integration"（同一 workflow、同样
            #       Contents: write，不带 --target 时却成功 —— 权限日志两轮都是
            #       Contents: write，差别只在 --target）。走 git 协议推 tag 不受此限。
            # 🔴 2026-08-06 加的防线：Zenodo 读的是 **tag 所指 commit 里的**
            #    .zenodo.json，不是 HEAD 里的。7 月版就栽在这：那个文件 08-03 才进仓，
            #    晚于 07-31 的月末 commit ⇒ Zenodo 读不到、退回用 GitHub 仓库元数据，
            #    标题变成仓名、作者列进了 github-actions[bot]，而**铸出的 DOI 改不回来**。
            #    光把文件改对不够，得有个动作去证明它在（§48：规矩要变成一个动作）。
            if ! git cat-file -e "${{ steps.bundle.outputs.sha }}:.zenodo.json" 2>/dev/null; then
              echo "::error::月末 commit ${{ steps.bundle.outputs.sha }} 里没有 .zenodo.json —— Zenodo 会退回 GitHub 元数据，铸出的 DOI 元数据永久错误。拒绝发版。"
              exit 1
            fi
            echo "::notice::.zenodo.json 存在于月末 commit ⇒ Zenodo 会读到我们自己的元数据"

            # 🔴 2026-08-07 补：四状态里此前漏了「tag 已推送、Release 创建失败」的中间态 ——
            #    重跑会在 git push 处炸掉，留在坏状态里出不来。先看远端有没有 tag：
            #    有且指向正确 ⇒ 跳过建 tag，只补 Release；有但指向错误 ⇒ 硬失败；没有 ⇒ 正常建。
            EXISTING="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
            [ -z "$EXISTING" ] && EXISTING="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
            if [ -n "$EXISTING" ] && [ "$EXISTING" != "${{ steps.bundle.outputs.sha }}" ]; then
              echo "::error::远端已有 tag $TAG 指向 $EXISTING ≠ 月末 commit —— 拒绝复用，请人工处理"
              exit 1
            fi
            if [ -z "$EXISTING" ]; then
              git tag "$TAG" "${{ steps.bundle.outputs.sha }}"
              git push origin "$TAG"
            else
              echo "::notice::远端 tag $TAG 已存在且指向正确（上次断在建 Release）—— 复用，只补 Release"
            fi
            gh release create "$TAG" "dist/kapx-ledger-$M.zip" \
              --title "Fear-Price indicator ledger $M" \
              --notes-file "dist/RELEASE_NOTES-$M.md"
          fi

      # 版本记录本身也存一份进 Wayback：与 daily.yml 同一条逻辑——
      # 我们自己的服务器上的时间戳不算数，别人存过的才算。
      - name: anchor the release page
        continue-on-error: true
        run: |
          U="https://github.com/${{ github.repository }}/releases/tag/ledger-${{ steps.bundle.outputs.month }}"
          # 2026-09-25：加 -f（原先 HTTP 429/5xx 退出码仍 0 ⇒ 印「已存档」；与 daily 的 bug A 同病，daily 已在 anchor_wayback.py 修）
          curl -fsS -m 60 "https://web.archive.org/save/$U" -o /dev/null \
            && echo "已存档 $U" \
            || echo "::warning::Release 页 Wayback 存档失败，该版本无独立见证"
